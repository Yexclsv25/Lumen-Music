[versions]
agp = "8.13.0"
kotlin = "2.1.0"
coreKtx = "1.17.0"
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
activity = "1.10.1"
lifecycle = "2.8.7"
coroutines = "1.10.2"
recyclerview = "1.4.0"
dynamicanimation = "1.1.0"
documentfile = "1.0.1"
palette = "1.0.0"
media3 = "1.8.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
