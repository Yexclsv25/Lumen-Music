plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

// Discord Social SDK: drop its .aar into app/libs to turn Rich Presence on.
// Without it the app builds with a harmless stub.
def discordAars = fileTree(dir: 'libs', include: ['*.aar'])
def hasDiscord = !discordAars.isEmpty()
def discordAppId = (project.findProperty('discordAppId') ?: '0').toString()

android {
    namespace 'com.yexclsv.localfiles'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yexclsv.localfiles'
        minSdk 27
        targetSdk 34
        versionCode 5
        versionName '2.1'
        manifestPlaceholders = [discordAppId: discordAppId]
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            java.srcDirs += [hasDiscord ? 'src/discord/kotlin' : 'src/nodiscord/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.recyclerview
    implementation libs.androidx.dynamicanimation
    implementation libs.androidx.documentfile
    implementation libs.androidx.palette
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.session
    if (hasDiscord) implementation discordAars
}
